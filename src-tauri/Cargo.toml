[package]
name = "kovaak-tracker"
version = "0.1.0"
description = "Track KovaaK's benchmark progress from your local stats folder"
authors = ["qinghai"]
license = ""
repository = "https://github.com/qinghai-ovo/KovaakTracker"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kovaak_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
